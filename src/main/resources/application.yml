spring:
  application:
    name: file-intake-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_intake}
    username: ${DB_USER:file_intake}
    password: ${DB_PASSWORD:file_intake}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_updates: true
        show_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.fileintake: INFO
  # Deliberate: no request/response body logging filter is configured anywhere in this
  # application. Upload credentials / signed session URIs must never be logged.

fileintake:
  submission:
    ttl-hours: 24
  upload:
    transport: fake # set to xml-multipart to use real GCS-signed URLs
    credential-ttl-minutes: 15
    bucket: ${GCS_BUCKET:}
  outbox:
    publisher: fake # set to pubsub to use real Pub/Sub; only relevant under the worker profile
    gcp-project-id: ${GCP_PROJECT_ID:}
    topic: ${PUBSUB_TOPIC:submission-committed}
    batch-size: 100
    poll-interval-ms: 5000
    publish-timeout-ms: 10000
