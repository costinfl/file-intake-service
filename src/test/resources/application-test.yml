spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

fileintake:
  upload:
    transport: fake
  outbox:
    publisher: fake
    # Large so the @Scheduled poller never fires on its own during a test run; the
    # OutboxPoller-specific test calls pollAndPublish() directly for determinism.
    poll-interval-ms: 3600000
